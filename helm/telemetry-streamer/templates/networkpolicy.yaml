{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "telemetry-streamer.role" (dict "ctx" . "role" "netpol") }}
  labels:
    {{- include "telemetry-streamer.labels" . | nindent 4 }}
spec:
  # Applies only to this release's pods; other components in the namespace are untouched.
  podSelector:
    matchLabels:
      {{- include "telemetry-streamer.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.networkPolicy.prometheus.from }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.prometheus.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.networkPolicy.ingest.to }}
    - to:
        {{- toYaml .Values.networkPolicy.ingest.to | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.ingest.port }}
    {{- end }}
{{- end }}
