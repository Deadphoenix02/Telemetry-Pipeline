apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetry-streamer.fullname" . }}
  labels:
    {{- include "telemetry-streamer.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "telemetry-streamer.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
      protocol: TCP
---
# Governing headless Service of the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetry-streamer.role" (dict "ctx" . "role" "headless") }}
  labels:
    {{- include "telemetry-streamer.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "telemetry-streamer.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
