{{- if and .Values.observability.alerts.enabled (not .Values.observability.prometheus.enabled) (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
# Same rules as the dev Prometheus, for a Prometheus Operator install (prod).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ts.fullname" . }}
  labels:
    {{- include "ts.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- tpl (.Files.Get "files/alerts.yaml") . | nindent 2 }}
{{- end }}
