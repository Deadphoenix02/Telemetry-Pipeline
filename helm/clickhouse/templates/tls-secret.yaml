{{- if .Values.security.tls.enabled }}
{{- /*
Helm-generated CA and certificates. Generated once and reused on every upgrade (looked up from
the cluster), so pods and clients keep trusting the same CA. Rotation: delete the Secrets and
upgrade; every pod rolls and clients need the new CA.
*/}}
{{- $fn := include "ts.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $t := .Values.security.tls }}
{{- $existing := lookup "v1" "Secret" $ns (printf "%s-tls" $fn) }}
{{- $data := dict }}
{{- if and $existing $existing.data }}
{{- $data = $existing.data }}
{{- else }}
{{- $ca := genCA (printf "%s-ca" $fn) (int $t.caValidityDays) }}
{{- $chNames := list "localhost" (printf "clickhouse-%s" $fn) (printf "clickhouse-%s.%s.svc" $fn $ns) (printf "clickhouse-%s.%s.svc.cluster.local" $fn $ns) }}
{{- range $h := splitList "," (include "ts.hosts" .) }}
{{- $chNames = concat $chNames (list $h (printf "%s.%s" $h $ns) (printf "%s.%s.svc" $h $ns) (printf "%s.%s.svc.cluster.local" $h $ns)) }}
{{- end }}
{{- $ch := genSignedCert (printf "%s-clickhouse" $fn) (list "127.0.0.1") $chNames (int $t.certValidityDays) $ca }}
{{- $kn := include "ts.keeperName" . }}
{{- $kNames := list "localhost" (printf "keeper-%s" $kn) (printf "keeper-%s.%s.svc" $kn $ns) (printf "keeper-%s.%s.svc.cluster.local" $kn $ns) }}
{{- range $h := splitList "," (include "ts.keeperHosts" .) }}
{{- $kNames = concat $kNames (list $h (printf "%s.%s" $h $ns) (printf "%s.%s.svc" $h $ns) (printf "%s.%s.svc.cluster.local" $h $ns)) }}
{{- end }}
{{- $kp := genSignedCert (printf "%s-keeper" $fn) (list "127.0.0.1") $kNames (int $t.certValidityDays) $ca }}
{{- $data = dict
      "ca.crt" ($ca.Cert | b64enc)
      "ca.key" ($ca.Key | b64enc)
      "clickhouse.crt" ($ch.Cert | b64enc)
      "clickhouse.key" ($ch.Key | b64enc)
      "keeper.crt" ($kp.Cert | b64enc)
      "keeper.key" ($kp.Key | b64enc) }}
{{- range $u := list "collector" "api" }}
{{- $c := genSignedCert $u nil nil (int $t.certValidityDays) $ca }}
{{- $_ := set $data (printf "%s.crt" $u) ($c.Cert | b64enc) }}
{{- $_ := set $data (printf "%s.key" $u) ($c.Key | b64enc) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-tls
  labels:
    {{- include "ts.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k := keys $data | sortAlpha }}
  {{ $k }}: {{ index $data $k }}
  {{- end }}
{{- range $u := list "collector" "api" }}
---
# Client certificate for the {{ $u }} application (mount it in that application's pod).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-{{ $u }}-tls
  labels:
    {{- include "ts.labels" $ | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ index $data "ca.crt" }}
  tls.crt: {{ index $data (printf "%s.crt" $u) }}
  tls.key: {{ index $data (printf "%s.key" $u) }}
{{- end }}
{{- end }}
