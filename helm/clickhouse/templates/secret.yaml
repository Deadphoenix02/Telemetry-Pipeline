{{- if not .Values.auth.existingSecret }}
{{- $name := include "ts.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ts.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $u := list "migrator" "collector" "api" "backup" }}
{{- $key := printf "%s-password" $u }}
{{- $pw := "" }}
{{- if and $existing (hasKey $existing.data $key) }}
{{- $pw = index $existing.data $key | b64dec }}
{{- else }}
{{- $pw = randAlphaNum 32 }}
{{- end }}
  {{ $key }}: {{ $pw | b64enc }}
  {{ $key }}-sha256: {{ $pw | sha256sum | b64enc }}
{{- end }}
{{- range $k := list "s3-access-key" "s3-secret-key" }}
{{- $v := "" }}
{{- if and $existing (hasKey $existing.data $k) }}
{{- $v = index $existing.data $k | b64dec }}
{{- else }}
{{- $v = randAlphaNum 32 }}
{{- end }}
  {{ $k }}: {{ $v | b64enc }}
{{- end }}
{{- end }}
