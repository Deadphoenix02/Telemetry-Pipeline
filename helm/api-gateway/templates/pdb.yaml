{{- if gt (int .Values.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "api-gateway.role" (dict "ctx" . "role" "pdb") }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "api-gateway.selectorLabels" . | nindent 6 }}
{{- end }}
