apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "collector.fullname" . }}
  labels:
    {{- include "collector.labels" . | nindent 4 }}
spec:
  {{- if not (include "collector.keda" .) }}
  replicas: {{ int .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "collector.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "collector.role" (dict "ctx" . "role" "sa") }}
      automountServiceAccountToken: false
      # On SIGTERM: insert and commit the buffer, leave the group, exit.
      terminationGracePeriodSeconds: {{ add (int .Values.collector.shutdownGraceSeconds) 5 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "collector.selectorLabels" . | nindent 14 }}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: COLLECTOR_BROKERS
              value: {{ include "collector.brokers" . | quote }}
            - name: COLLECTOR_GROUP
              value: {{ .Values.collector.group | quote }}
            - name: COLLECTOR_CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: COLLECTOR_CH_ADDR
              value: {{ .Values.clickhouse.addr | quote }}
            - name: COLLECTOR_CH_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: COLLECTOR_CH_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: COLLECTOR_CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.passwordSecret.name }}
                  key: {{ .Values.clickhouse.passwordSecret.key }}
            - name: COLLECTOR_CH_TABLE
              value: {{ .Values.clickhouse.table | quote }}
            - name: COLLECTOR_CH_GPUS_TABLE
              value: {{ .Values.clickhouse.gpusTable | quote }}
            - name: COLLECTOR_BATCH_ROWS
              value: {{ int .Values.collector.batchRows | quote }}
            - name: COLLECTOR_BATCH_WAIT
              value: {{ .Values.collector.batchWait | quote }}
            - name: COLLECTOR_BUFFER_MB
              value: {{ int .Values.collector.bufferMB | quote }}
            - name: COLLECTOR_INSERT_TIMEOUT
              value: {{ .Values.collector.insertTimeout | quote }}
            - name: COLLECTOR_POISON_POLICY
              value: {{ .Values.collector.poisonPolicy | quote }}
            - name: COLLECTOR_REGISTRY_REFRESH
              value: {{ .Values.collector.registryRefresh | quote }}
            - name: COLLECTOR_SHUTDOWN_GRACE
              value: {{ printf "%ds" (int .Values.collector.shutdownGraceSeconds) | quote }}
            - name: COLLECTOR_HTTP_ADDR
              value: {{ printf ":%d" (int .Values.service.port) | quote }}
            - name: COLLECTOR_LOG_LEVEL
              value: {{ .Values.collector.logLevel | quote }}
            - name: GOMEMLIMIT
              value: {{ .Values.collector.goMemLimit | quote }}
            - name: GOMAXPROCS          # from the CPU limit, rounded up
              valueFrom:
                resourceFieldRef:
                  containerName: collector
                  resource: limits.cpu
                  divisor: "1"
          ports:
            - name: metrics
              containerPort: {{ int .Values.service.port }}
              protocol: TCP
          # Liveness never depends on ClickHouse or the broker: a restart fixes neither.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          # Ready = in the consumer group and ClickHouse answering; drops on SIGTERM.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
