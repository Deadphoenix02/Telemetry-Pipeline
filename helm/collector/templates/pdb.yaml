{{- if or (include "collector.keda" .) (gt (int .Values.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "collector.role" (dict "ctx" . "role" "pdb") }}
  labels:
    {{- include "collector.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "collector.selectorLabels" . | nindent 6 }}
{{- end }}
